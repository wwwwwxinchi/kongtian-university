<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>打印管理 · 空天大学</title><link rel="icon" href="../assets/favicon.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="activity.css"><script src="admin.js" defer></script></head>
<body><header class="site-header"><a class="university" href="../index.html"><img src="../assets/emblem-white.webp" width="44" height="44" alt=""><span><strong>空天大学</strong><small>KONGTIAN UNIVERSITY</small></span></a><div class="header-tools"><a class="quiet-button" href="./">制作校园卡</a><button class="quiet-button" id="logout" hidden>退出登录</button></div></header>
<main class="admin-shell"><h1>校园卡打印管理</h1><p class="admin-lead">按姓名与学号查找校园卡，下载最新提交的正面图片。</p>
<form class="admin-panel login-panel" id="login"><h2>管理员登录</h2><label class="field-label" for="username">账号</label><input class="text-input" id="username" autocomplete="username" required value="admin"><label class="field-label" for="password">密码</label><input class="text-input" id="password" type="password" autocomplete="current-password" required><button class="primary-button" type="submit">登录</button></form>
<p class="admin-message" id="message" role="status" aria-live="polite"></p>
<section id="dashboard" hidden aria-label="打印图片管理"><div class="admin-panel admin-toolbar"><div><label class="receive-toggle"><input type="checkbox" id="accepting" role="switch">接收打印图片</label><p class="field-hint" id="switch-hint">关闭时不会接收新图片，已提交图片仍可下载。</p></div><div class="admin-controls"><label for="search">查找图片</label><input class="text-input" type="search" id="search" placeholder="姓名、学号或完整文件名"><button class="outline-button" id="refresh">刷新</button></div></div><p id="count" class="admin-message"></p><div class="image-grid" id="images"></div><p class="admin-empty" id="empty" hidden>还没有收到校园卡。开启接收后，同学们即可提交打印。</p><div class="pager"><button class="outline-button" id="previous">上一页</button><span id="page-number"></span><button class="outline-button" id="next">下一页</button></div></section>
</main></body></html>
